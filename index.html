<style>
/* Layout: one-screen wedding-invitation card — HUD band, photo playfield, big d-pad below */
:root{

  color-scheme:light;
}
html,body{height:100%;overscroll-behavior:none}
html{box-sizing:border-box}
body{margin:0;position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

.app{touch-action:none;height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:10px;box-sizing:border-box;max-width:560px;margin:0 auto}
.hud{width:100%;display:flex;flex-direction:column;gap:7px;flex:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.xi{font-weight:900;color:#c4374a;font-size:22px;line-height:1}
.brand .ttl{font-family:var(--body);font-weight:900;font-size:19px;letter-spacing:.12em;color:var(--ink);white-space:nowrap}
.beta.gold{color:#8a6430;background:#fbf1e4;border-color:var(--gold)}
.beta{flex:none;font-size:11px;font-weight:700;letter-spacing:.08em;color:#b85466;background:#fdf0f2;border:1px solid var(--rose);border-radius:999px;padding:1px 7px;line-height:1.5}
.brand .amp{font-family:var(--display);font-style:italic;color:var(--gold);font-weight:600;font-size:22px;letter-spacing:0;margin:0 1px}
.stage-no{white-space:nowrap;flex:none;font-size:13px;color:var(--dim);letter-spacing:.08em}
.stage-no b{color:var(--gold);font-family:var(--display);font-size:18px;font-style:italic}
.lives{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--dim)}
.lives svg{width:22px;height:22px}
.lives .n{font-variant-numeric:tabular-nums;margin-left:2px;color:var(--ink);font-weight:700}
.meter{position:relative;height:10px;border-radius:5px;background:#f0e4dc;border:1px solid var(--line)}
.meter i{position:absolute;inset:0 auto 0 0;width:0;border-radius:5px;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .25s}
.meter b{position:absolute;top:-4px;bottom:-4px;left:80%;width:2px;background:var(--ink);border-radius:1px}
.meter em{position:absolute;left:80%;top:12px;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--dim)}
.pctline .clock b{color:var(--ink);font-size:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ptag{font-size:12px;color:var(--ink);background:#fbf1e4;border:1px solid var(--line);border-radius:999px;padding:0 8px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.6}
.pname{font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--gold);border-radius:10px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box;text-align:center}
.namehint2{font-size:12.5px!important;line-height:1.65!important;color:#b85466!important}
.namehint2 b{color:#b85466}
button.go:disabled{opacity:.45;cursor:not-allowed}
.final input[readonly]{background:#f6eee8;color:var(--ink);font-weight:700}
.mus{font:inherit;font-size:13px;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.mus[aria-pressed="true"]{color:var(--ink);border-color:var(--gold);background:#fbf1e4}
.pctline{align-items:center;gap:6px;display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:6px}
.field{position:relative;flex:1 1 0;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;overflow:hidden}
.frame{position:relative;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px -14px rgba(61,44,51,.35)}
.frame::after{content:"";position:absolute;inset:2px;border:1px solid rgba(185,138,75,.45);border-radius:4px;pointer-events:none}
canvas#cv{display:block;touch-action:none;border-radius:2px;background:var(--plum)}
.overlay{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(251,246,241,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-sizing:border-box}
.card{background:rgba(255,253,251,.95);border:1px solid var(--line);border-radius:8px;padding:22px 22px 18px;text-align:center;max-width:300px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px -12px rgba(61,44,51,.4);position:relative}
.card::before{content:"";position:absolute;inset:5px;border:1px solid rgba(185,138,75,.5);border-radius:5px;pointer-events:none}
.card .eyebrow{font-family:var(--display);font-style:italic;color:var(--gold);font-size:16px;letter-spacing:.06em}
.card h2{margin:0;font-size:24px;font-weight:900;letter-spacing:.08em;text-wrap:balance}
.card p{margin:0;color:var(--dim);line-height:1.7;font-size:14px}
.card .tags{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.card .tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink)}
.card{max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-sizing:border-box;width:100%}
.card>*{flex-shrink:0}
.card.tut{max-width:340px;width:100%;gap:9px;padding:18px 18px 14px}
.demo{height:min(196px,26vh);width:auto;max-width:100%;align-self:center;aspect-ratio:3/2;border-radius:4px;border:1px solid var(--line);display:block;background:var(--plum)}
.tut .cap{min-height:3.4em;color:var(--ink);font-size:14px;line-height:1.7;margin:0;text-wrap:balance}
.tut .cap b{color:var(--gold)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.dots i.on{background:var(--rose);transform:scale(1.25)}
.card.tut{gap:7px}
@media (max-height:640px){
  .card{padding:14px 16px 12px;gap:7px}.card.tut{padding:12px 14px 10px;gap:6px}
  .card h2{font-size:20px}.card .eyebrow{font-size:13px}
  .card p{font-size:13px;line-height:1.6}.tut .cap{font-size:13px;line-height:1.6}
  button.go{padding:10px 18px;font-size:15px}.gift .nodup{font-weight:500;font-size:.92em;opacity:.9}
.gift{font-size:12px;padding:5px 8px}
  .pad{grid-template-rows:repeat(2,54px)}.pad button{font-size:24px}.hint{display:none}
  .app{gap:6px;padding-block:6px}.hud{gap:4px}
}
@media (max-width:370px){.brand .ttl{font-size:15px!important;letter-spacing:.02em!important}.beta{font-size:10px;padding:0 5px}.xi{font-size:19px}.lives>span:first-child{display:none}.mus{padding:4px 9px;font-size:12px}.brand .ttl{font-size:17px;letter-spacing:.06em}}
@media (max-height:520px){.demo{height:min(150px,24vh)}.card .eyebrow{display:none}}
.app:has(#ov:not([hidden])) .pad,.app:has(#ov:not([hidden])) .hint{display:none}
@media (max-height:760px){.gift{margin:0;font-size:13px;font-weight:700;color:#b85466;background:#fdf0f2;border:1px dashed var(--rose);border-radius:8px;padding:6px 10px}
.tut .ctl{display:none}.tut .cap{min-height:0}}
.tut .ctl{font-size:12px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px;margin:0;line-height:1.6}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:-6px;position:relative;z-index:1}
a.pill{font-size:13px;color:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:4px 12px;background:#fbf1e4;text-decoration:none}
button.link.skip{text-decoration:none;font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
button.link{font:inherit;font-size:13px;background:none;border:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px}
button.go{font:inherit;font-weight:700;font-size:16px;letter-spacing:.1em;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:12px 20px;cursor:pointer}
button.go.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(3,min(112px,29vw));grid-template-rows:repeat(2,72px);gap:6px;flex:none;touch-action:none}
.pad button{font-size:30px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;cursor:pointer;touch-action:none;
  box-shadow:0 4px 0 var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding:0;transition:transform .05s,background .05s}
.pad button.on{background:#f6dfe3;color:var(--rose);transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.clearbar{flex:none;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px -14px rgba(61,44,51,.4);text-align:center;animation:rise .35s ease-out}
.clearbar .cbtext{display:flex;flex-direction:column;gap:2px}
.clearbar .eyebrow{font-family:var(--display);font-style:italic;color:var(--gold);font-size:15px}
.clearbar b{font-size:20px;font-weight:900;letter-spacing:.08em}
.clearbar span{font-size:13px;color:var(--dim)}
.clearbar button{font-size:17px;padding:14px 20px}
@keyframes rise{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.clearbar{animation:none}}
.hint{font-size:12px;color:var(--dim);flex:none;text-align:center}
@media not (any-pointer:coarse){.pad{display:none}}
/* final certificate screen */
.final{position:fixed;inset:0;background:var(--paper);overflow-y:auto;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  -webkit-user-select:auto;user-select:auto}
.final .wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.final h1{margin:0;text-align:center;font-size:22px;font-weight:900;letter-spacing:.1em}
.final .sub{text-align:center;color:var(--dim);font-size:13px;margin:-6px 0 0}
.final img{width:100%;border-radius:6px;border:1px solid var(--line);box-shadow:0 10px 30px -14px rgba(61,44,51,.4);-webkit-touch-callout:default}
.final label{font-size:13px;color:var(--dim)}
.final input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
.final .btns{display:flex;flex-direction:column;gap:8px}
a.go{display:block;font:inherit;font-weight:700;font-size:15px;letter-spacing:.1em;padding:12px 20px;border-radius:999px;color:var(--paper);background:var(--ink);border:1px solid var(--ink);text-align:center;text-decoration:none;box-sizing:border-box}
a.go.alt{background:transparent;color:var(--ink)}
a.go.off{background:transparent;color:#b85466;border:1px dashed var(--rose);cursor:not-allowed}
a.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.namehint{margin:-4px 0 0;font-size:12.5px;line-height:1.6;color:#b85466}
.final .msg{text-align:center;font-size:13px;color:var(--dim);min-height:1.2em}
</style>

</div>

  lvl=n;L=LEVELS[n];W=L.W;H=L.H;
  CW=W>H?900:600;CH=W>H?600:900;cv.width=CW;cv.height=CH;cs=CW/W;
  mask.width=W;mask.height=H;mdata=mctx.createImageData(W,H);
  interior=(W-4)*(H-4);
  grid=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(x<2||y<2||x>=W-2||y>=H-2) grid[idx(x,y)]=1;
  player={x:W>>1,y:H-1,face:[0,-1]};dir=null;trail=[];
  const rs=()=>Math.random()<.5?-1:1;
  enemies=[];for(let i=0;i<L.balls;i++) enemies.push({x:8+Math.random()*(W-16),y:6+Math.random()*(H*0.6),vx:rs()*L.speed*(.85+Math.random()*.3),vy:rs()*L.speed*(.8+Math.random()*.3)});
  inv=0;
  pct=0;flash=0;revealT=0;stepT=0;
  $('lv').textContent=n+1;
  updMask();hud();fit();
}
function updMask(){
  const d=mdata.data;
  for(let i=0;i<W*H;i++){const g=grid[i],o=i*4;
    if(g===0){d[o]=44;d[o+1]=32;d[o+2]=48;d[o+3]=255}
    else if(g===2){d[o]=232;d[o+1]=190;d[o+2]=120;d[o+3]=255}
    else d[o+3]=0}
  mctx.putImageData(mdata,0,0);
}
const heart=(on)=>`<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.2 0 3.6 1.2 5.4 3.2 1.8-2 3.2-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z" fill="${on?'#d77a8a':'none'}" stroke="${on?'#b85466':'#c9b7b0'}" stroke-width="1.6"/></svg>`;
function hud(){
  $('pct').textContent=Math.floor(pct*100)+'%';
  $('bar').style.width=Math.min(100,pct/GOAL*80)+'%';
  let h='<span>生命</span>';for(let i=0;i<MAXLIFE;i++) h+=heart(i<lives);h+=`<span class="n">×${Math.max(0,lives)}</span>`;
  $('lives').innerHTML=h;
}
/* size the photo to whatever space the field has; re-checked every frame so it
   follows toolbars appearing, cards opening/closing and the d-pad showing/hiding */
let fitKey='';
function fit(force){
  const f=$('field'),w=f.clientWidth,h=f.clientHeight,key=w+'x'+h+'x'+CW;
  if(!force&&key===fitKey)return;fitKey=key;
  if(w<20||h<20)return;
  const s=Math.max(.05,Math.min((w-14)/CW,(h-14)/CH));
  cv.style.width=Math.floor(CW*s)+'px';cv.style.height=Math.floor(CH*s)+'px';
}
addEventListener('resize',()=>{fit(true);resetScroll()});addEventListener('scroll',()=>{if($('final').hidden)resetScroll()},{passive:true});addEventListener('orientationchange',()=>setTimeout(()=>fit(true),300));

/* ---------- rules ---------- */
function calcPct(){let c=0;for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++) if(grid[idx(x,y)]===1)c++;return c/interior}
function closeArea(){
  for(const p of trail) grid[idx(p.x,p.y)]=1;
  trail=[];
  const seen=new Uint8Array(W*H),st=[];
  for(const e of enemies){const i=idx(Math.floor(e.x),Math.floor(e.y));if(grid[i]===0&&!seen[i]){seen[i]=1;st.push(i)}}
  while(st.length){const i=st.pop(),x=i%W,y=(i/W)|0;
    if(x>0)tryp(i-1);if(x<W-1)tryp(i+1);if(y>0)tryp(i-W);if(y<H-1)tryp(i+W)}
  function tryp(j){if(!seen[j]&&grid[j]===0){seen[j]=1;st.push(j)}}
  for(let i=0;i<W*H;i++) if(grid[i]===0&&!seen[i]) grid[i]=1;
  pct=calcPct();updMask();hud();
  if(pct>=GOAL) clearLevel();
}
function die(){
  if(inv>0||state!=='play')return;
  lives=Math.max(0,lives-1);flash=1;inv=1500;
  for(const p of trail) grid[idx(p.x,p.y)]=0;
  if(trail.length){player.x=trail[0].px;player.y=trail[0].py}
  trail=[];dir=null;updMask();hud();
  try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
  if(lives<=0) gameOver();
}
function step(){
  if(!dir)return;
  const nx=player.x+dir[0],ny=player.y+dir[1];
  if(nx<0||ny<0||nx>=W||ny>=H){dir=null;return}
  const here=grid[idx(player.x,player.y)],g=grid[idx(nx,ny)];
  if(g===2){die();return}
  player.face=dir;
  if(g===0){trail.push({x:nx,y:ny,px:player.x,py:player.y});grid[idx(nx,ny)]=2;player.x=nx;player.y=ny;updMask()}
  else{player.x=nx;player.y=ny;if(here===2){closeArea();dir=null}}
}
function near(o){return Math.abs(o.x-(player.x+.5))<1&&Math.abs(o.y-(player.y+.5))<1}
function moveEnemies(k){
  for(const e of enemies){
    const sea=(x,y)=>grid[idx(Math.floor(x),Math.floor(y))]!==1;
    let nx=e.x+e.vx*k; if(!sea(nx,e.y)){e.vx*=-1;nx=e.x+e.vx*k}
    let ny=e.y+e.vy*k; if(!sea(nx,ny)){e.vy*=-1;ny=e.y+e.vy*k}
    if(!sea(nx,ny)){e.vx*=-1;e.vy*=-1;continue}
    e.x=nx;e.y=ny;
    if(grid[idx(Math.floor(e.x),Math.floor(e.y))]===2||(trail.length&&near(e))){die();return}
  }

}

/* ---------- drawing ---------- */
function drawCar(){
  const cx=(player.x+.5)*cs,cy=(player.y+.5)*cs,[fx,fy]=player.face,s=cs/10;
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.rotate(Math.atan2(fy,fx)+Math.PI/2);
  ctx.fillStyle='#2c2030';[[-8,-7],[5,-7],[-8,3],[5,3]].forEach(([x,y])=>ctx.fillRect(x,y,3,5));
  ctx.fillStyle='#ffffff';ctx.strokeStyle='#3d2c33';ctx.lineWidth=1.3;
  ctx.beginPath();ctx.roundRect(-6,-11,12,22,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#bfe0ea';ctx.fillRect(-4,-7,8,4);
  ctx.fillStyle='#d77a8a';ctx.beginPath();ctx.moveTo(0,1);ctx.lineTo(-5,-2);ctx.lineTo(-5,4);ctx.closePath();ctx.moveTo(0,1);ctx.lineTo(5,-2);ctx.lineTo(5,4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(0,1,1.6,0,7);ctx.fill();
  ctx.strokeStyle='#b98a4b';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-3,11);ctx.lineTo(-5,16);ctx.moveTo(3,11);ctx.lineTo(5,16);ctx.stroke();
  ctx.restore();
}
function drawRing(x,y,t){
  const r=cs*.9;ctx.save();ctx.translate(x*cs,y*cs);
  const g=ctx.createRadialGradient(0,0,0,0,0,r*2.2);g.addColorStop(0,'rgba(255,90,120,.55)');g.addColorStop(1,'rgba(255,90,120,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*2.2,0,7);ctx.fill();
  ctx.fillStyle='#e0566f';ctx.strokeStyle='#fff';ctx.lineWidth=cs*.12;
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();
  ctx.rotate(t/300);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*.45,0,r*.18,0,7);ctx.fill();
  ctx.restore();
}
function drawThorn(l,t){
  ctx.save();ctx.translate(l.x*cs,l.y*cs);ctx.rotate(t/220);const r=cs*.8;
  ctx.fillStyle='#7f9672';ctx.strokeStyle='#2f3b29';ctx.lineWidth=cs*.12;ctx.beginPath();
  for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i*Math.PI/5;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
function draw(t){
  ctx.clearRect(0,0,CW,CH);
  const im=imgs[lvl];if(im.complete)ctx.drawImage(im,0,0,CW,CH);
  if(!(state==='clear'&&revealT>=1)){
    ctx.save();if(state==='clear')ctx.globalAlpha=1-revealT;
    ctx.imageSmoothingEnabled=false;ctx.drawImage(mask,0,0,CW,CH);ctx.restore();
  }
  if(state==='clear')return;
  ctx.strokeStyle='rgba(232,190,120,.07)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x+=4){ctx.moveTo(x*cs,0);ctx.lineTo(x*cs,CH)}
  for(let y=0;y<=H;y+=4){ctx.moveTo(0,y*cs);ctx.lineTo(CW,y*cs)}
  ctx.stroke();
  for(const e of enemies) drawRing(e.x,e.y,t);
  if(!(inv>0&&Math.floor(t/120)%2))drawCar();
  if(flash>0){ctx.fillStyle=`rgba(215,122,138,${flash*.45})`;ctx.fillRect(0,0,CW,CH)}
}
function loop(t){
  fit();
  const dt=Math.min(50,t-(last||t));last=t;
  if(state==='play'){
    playMs+=dt;levelMs[lvl]+=dt;const ct=fmtTime(playMs);if($('clock').textContent!==ct)$('clock').textContent=ct;
    stepT+=dt;while(stepT>=STEP_MS&&state==='play'){stepT-=STEP_MS;step()}
    if(state==='play')moveEnemies(dt/16.67);
  }
  if(state==='clear')revealT=Math.min(1,revealT+dt/900);
  flash=Math.max(0,flash-dt/400);if(state==='play')inv=Math.max(0,inv-dt);
  draw(t);requestAnimationFrame(loop);
}

/* ---------- flow ---------- */
/* focus helps keyboard players only; on phones it can make the browser scroll the page and shift the layout */
const COARSE=matchMedia('(pointer:coarse)').matches;
function softFocus(el){if(!el||COARSE)return;try{el.focus({preventScroll:true})}catch(e){}}
function resetScroll(){if(window.scrollX||window.scrollY)window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}
function card(html){$('card').innerHTML=html;$('card').scrollTop=0;$('ov').hidden=false;softFocus($('card').querySelector('button'));resetScroll();fit(true)}

function clearLevel(){
  state='clear';dir=null;
  const last=lvl>=LEVELS.length-1;if(last)totalMs=playMs;
  setTimeout(()=>{
    $('cbE').textContent=last?'All Clear':`Stage ${lvl+1} Clear`;
    $('cbT').textContent=LEVELS[lvl].clearT;
    $('cbS').innerHTML=`${LEVELS[lvl].clearS}<br>本關 ${fmtTime(levelMs[lvl])} · 揭開 ${Math.floor(pct*100)}% · 剩 ${lives} 顆愛心`;
    $('cbGo').textContent=last?'領取通關證明 ›':`進入第 ${lvl+2} 關 ›`;

}
$('cbGo').onclick=()=>{
  $('clearbar').hidden=true;$('pad').hidden=false;$('hint').hidden=false;
  if(lvl>=LEVELS.length-1) showFinal(); else {loadLevel(lvl+1);state='intro';introCard()}
};
function gameOver(){
  state='over';
  const l=LEVELS[lvl];card(`<div class="eyebrow">Game Over</div><h2>${l.overT}</h2><p>${l.overP}</p><p style="font-size:13px">這次揭開到 ${Math.floor(pct*100)}%，重來會從這關開始，愛心補滿三顆。</p><button class="go" id="go">從這一頁重新開始</button>`);
  $('go').onclick=()=>{lives=MAXLIFE;loadLevel(lvl);state='play';$('ov').hidden=true};
}
/* restart the whole run from stage 1, with an in-page confirmation */
function askRestart(){
  if(!$('final').hidden)return;
  const prev=state;if(state==='play'){state='paused';dir=null}
  card(`<div class="eyebrow">Restart</div><h2>要重新開始嗎？</h2><p>會回到第 1 關，愛心補滿三顆、計時歸零。</p>
  <button class="go" id="go">確定重新開始</button><button class="go alt" id="cancel">繼續玩</button>`);
  $('go').onclick=()=>{$('clearbar').hidden=true;$('pad').hidden=false;$('hint').hidden=false;newRun()};
  $('cancel').onclick=()=>{
    if(prev==='play'){state='play';$('ov').hidden=true}
    else if(prev==='clear'){state='clear';$('ov').hidden=true}
    else if(prev==='over'){gameOver()}
    else{state='intro';tutSeen?introCard():tutorialCard()}
  };
}
$('restart').addEventListener('click',e=>{e.stopPropagation();askRestart()});
/* ---------- one name per phone ---------- */
const LS_NAME='wq-final-name',LS_DEV='wq-final-dev';
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let PLAYER=lsGet(LS_NAME).trim().slice(0,12);
let DEV=lsGet(LS_DEV);
if(!/^[a-z0-9]{12,40}$/.test(DEV)){DEV=(Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g,'').slice(0,24);lsSet(LS_DEV,DEV)}
/* phone "signature": lets the server recognise a phone again when the browser has forgotten this page's storage
   (iPhone Safari wipes storage of embedded pages such as this one once Safari is closed) */
const FP=(function(){const p=[navigator.userAgent,screen.width+'x'+screen.height,window.devicePixelRatio,screen.colorDepth,(navigator.languages||[navigator.language]).join(','),
  (Intl.DateTimeFormat().resolvedOptions().timeZone||''),navigator.hardwareConcurrency||0,navigator.maxTouchPoints||0,navigator.platform||''];
  try{const c=document.createElement('canvas');c.width=220;c.height=40;const x=c.getContext('2d');x.textBaseline='top';x.font='16px serif';x.fillStyle='#d4566a';x.fillRect(0,0,60,20);
    x.fillStyle='#2c2030';x.fillText('囍 纘&凌 Qix 1114 ✿',4,8);p.push(c.toDataURL().slice(-120))}catch(e){}
  try{const g=document.createElement('canvas').getContext('webgl');const d=g&&g.getExtension('WEBGL_debug_renderer_info');if(d)p.push(g.getParameter(d.UNMASKED_RENDERER_WEBGL))}catch(e){}
  const str=p.join('|');let h1=0x811c9dc5,h2=0x1505;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0}
  return (h1.toString(36)+h2.toString(36)).replace(/[^a-z0-9]/g,'').slice(0,20)})();
/* every run started on this phone counts as one play */
let PLAYS=parseInt(lsGet('wq-final-plays'),10)||0;
function countPlay(){PLAYS++;lsSet('wq-final-plays',String(PLAYS))}
function nameCard(){
  state='intro';
  card(`<div class="eyebrow">Welcome</div><h2>先輸入你的名字</h2>
  <input id="pname" class="pname" maxlength="12" placeholder="例如：新郎同學 阿明" autocomplete="off" enterkeyhint="done">
  <p class="namehint2">名字會綁定這支手機，之後每一次遊玩的成績都記在這個名字，排行榜只留你最好的一次。<b>確定後無法修改。</b></p>
  <button class="go" id="go">確定，開始</button>`);
  const inp=$('pname'),go=$('go');
  const ok=()=>{go.disabled=!inp.value.trim()};ok();
  inp.addEventListener('input',()=>{ok();$('nmsg')&&($('nmsg').textContent='')});
  const done=()=>{const v=inp.value.trim().slice(0,12);if(!v){inp.focus();return}
    PLAYER=v;lsSet(LS_NAME,v);try{google.script.run.bindDevice(FP,DEV,v)}catch(e){}$('ptag').textContent=v;$('ptag').hidden=false;tutSeen?introCard():tutorialCard()};
  go.onclick=done;inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done()}});
}
/* no name stored on this phone: first ask the server whether it already knows this phone */
function nameStart(){
  const run=window.google&&google.script&&google.script.run;
  if(!run){nameCard();return}
  state='intro';card(`<div class="eyebrow">Welcome</div><h2>載入中⋯</h2>`);
  let settled=false;const give=r=>{if(settled)return;settled=true;clearTimeout(tm);r&&r.name?knownCard(r):nameCard()};
  const tm=setTimeout(()=>give(null),4000);
  try{run.withSuccessHandler(give).withFailureHandler(()=>give(null)).lookupDevice(FP)}catch(e){give(null)}
}
function knownCard(r){
  state='intro';
  card(`<div class="eyebrow">Welcome back</div><h2>歡迎回來！</h2>
  <p class="namehint2" style="font-size:1.05em">這支手機已經用「<b id="kname"></b>」登記過，<br>成績會繼續記在這個名字。</p>
  <button class="go" id="go">繼續，開始</button>
  <p class="namehint2" style="margin-top:.6em"><a href="#" id="notme" style="color:inherit;opacity:.7">這不是我的手機？</a></p>`);
  $('kname').textContent=r.name;
  $('go').onclick=()=>{PLAYER=String(r.name).slice(0,12);lsSet(LS_NAME,PLAYER);
    if(/^[a-z0-9]{12,40}$/.test(r.dev||'')){DEV=r.dev;lsSet(LS_DEV,DEV)}
    if(r.plays>PLAYS){PLAYS=r.plays;lsSet('wq-final-plays',String(PLAYS))}
    $('ptag').textContent=PLAYER;$('ptag').hidden=false;tutSeen?introCard():tutorialCard()};
  $('notme').onclick=e=>{e.preventDefault();nameCard()};
}
function newRun(){runStart=0;playMs=0;levelMs=[0,0,0];$('clock').textContent='0:00';lives=MAXLIFE;loadLevel(0);state='intro';!PLAYER?nameStart():tutSeen?introCard():tutorialCard()}

function runDemo(c){
  const g=c.getContext('2d'),DW=24,DH=16,S=20,T0=performance.now();
  const P1=[],P2=[];for(let y=14;y>=6;y--)P1.push([12,y]);for(let x=13;x<=19;x++)P1.push([x,6]);for(let y=7;y<=15;y++)P1.push([19,y]);
  for(let y=14;y>=8;y--)P2.push([5,y]);
  const D1=P1.length*95,TOTAL=D1+1700+1900+2600;
  // phase-4 fill order: deterministic shuffle of interior cells
  const cells=[];for(let y=1;y<DH-1;y++)for(let x=1;x<DW-1;x++)if(!(x>=13&&x<=18&&y>=7&&y<=14))cells.push([x,y]);
  let sd=7;cells.sort(()=>((sd=sd*16807%2147483647)/2147483647)-.5);
  const im=imgs[0];let lastCap=-1;
  function car(x,y,dx,dy){g.save();g.translate((x+.5)*S,(y+.5)*S);g.rotate(Math.atan2(dy,dx)+Math.PI/2);
    g.fillStyle='#fff';g.strokeStyle='#3d2c33';g.lineWidth=2;g.beginPath();g.roundRect(-7,-12,14,24,5);g.fill();g.stroke();

    tone(ch[[0,1,2,1][o]]+12,t,E8*1.8,'triangle',.035);
    // melody: long violin line, then the running eighths, then both together
    if((cyc===0||cyc===3)&&o===0){const m=LONG_A[ci];tone(m,t,E8*4.6,'sine',.13,.06);tone(m,t,E8*4.2,'triangle',.05,.06)}
    if(cyc===1&&o===0){const m=LONG_B[ci];tone(m,t,E8*4.6,'sine',.13,.06);tone(m,t,E8*4.2,'triangle',.05,.06)}
    if(cyc>=2){const m=RUN[ci][o]+12;tone(m,t,E8*1.6+.3,'triangle',cyc===3?.09:.13);tone(m+12,t,E8+.2,'sine',.025)}
    // bell sparkle at the top of each cycle
    if(step%32===0)tone(86,t,1.6,'sine',.04,.005);
  }
  function sched(){while(nextT<ac.currentTime+.15){tick(nextT);nextT+=E8;step++}}
  function start(){
    if(!ac)init();ac.resume&&ac.resume();
    if(!timer){nextT=ac.currentTime+.08;timer=setInterval(sched,25)}
    master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(.9,ac.currentTime,.3);
  }
  function stop(){if(!ac)return;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(0,ac.currentTime,.15);
    setTimeout(()=>{if(!on&&timer){clearInterval(timer);timer=null}},600)}
  function set(v){on=v;try{localStorage.setItem('wq-music',v?'1':'0')}catch(e){}
    v?start():stop();
    for(const id of ['mus','mus2']){const b=$(id);b.setAttribute('aria-pressed',v);b.textContent=v?'♪ 音樂：開':'♪ 音樂：關'}}
  document.addEventListener('visibilitychange',()=>{if(!ac)return;document.hidden?ac.suspend():on&&ac.resume()});
  return {set,get on(){return on}};
})();
for(const id of ['mus','mus2']) $(id).addEventListener('click',e=>{e.stopPropagation();Music.set(!Music.on)});
/* music defaults to on; browsers only allow sound after the first tap, so start it then */
let wantMusic=true;try{wantMusic=localStorage.getItem('wq-music')!=='0'}catch(e){}
if(wantMusic){const kick=e=>{if(e.target.closest&&e.target.closest('.mus'))return;removeEventListener('pointerdown',kick,true);removeEventListener('keydown',kick,true);Music.set(true)};
  addEventListener('pointerdown',kick,true);addEventListener('keydown',kick,true);}
if(PLAYER){$('ptag').textContent=PLAYER;$('ptag').hidden=false}
lives=MAXLIFE;newRun();requestAnimationFrame(loop);
